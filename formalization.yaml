#
# Verified against the repository at the pinned commit.  The commit SHA must be
# refreshed at submission time to the head that contains the Palomar scaffolding.

version: "v0.4"

project:
  name: "OrdinalAnalysis"
  description: >-
    A Lean 4 development of proof-theoretic ordinal analysis, built on Mathlib and on the
    Foundation library of first-order logic.  The result registered by this Comparator
    configuration is Gentzen's theorem that the proof-theoretic ordinal of Peano arithmetic is
    epsilon_0, in both halves: for the theory PA[X] (Peano arithmetic in the language
    0, 1, +, *, < with one fresh unary predicate X, with induction for every formula of that
    language), (upper bound) for every Cantor normal form a below epsilon_0 and every formula
    phi, PA[X] proves transfinite induction for phi along the standard ordering of the normal
    forms up to the numeral of the code of a, and (lower bound) PA[X] does not prove
    transfinite induction along the whole ordering for the bare predicate X.  The statement is
    given with Mathlib notions only: provability is read through Goedel's completeness theorem
    as truth in every model of PA[X] (resp. as failure in some model), and the coded ordering
    is not written as a formula but is an existentially quantified formula that in every model
    of PA[X] obeys the Cantor-normal-form comparison recursion on Nat.pair-codes, agrees on the
    natural numbers with Mathlib's order on notations (the order of the ordinals denoted), and
    relates nothing but codes of normal forms.  The proof in the development is Gentzen's: an
    internal notation system and the jump construction give the upper bound; embedding of
    PA[X]-derivations into an infinitary calculus with an evaluating instantiation, cut
    elimination with an explicit bound below epsilon_0, and a boundedness invariant give the
    lower bound.  The submitted Solution transports these two theorems, which are stated with
    Foundation's proof system, to the Mathlib-only statement through an explicit bridge between
    the two libraries' structures and formulas.  The wider repository contains further ordinal
    analyses: epsilon_1 for PA plus transfinite induction below epsilon_0, epsilon_{epsilon_0}
    for the second-order theory ACA, Gamma_0-level results for ramified analysis and the
    semiformal Feferman-Schuette theorem, the Bachmann-Howard ordinal for ID_1, and
    psi_0(epsilon_{Omega_n+1}) for ID_n and ID_omega; none of them is part of this
    registration.
  authors:
    - "KT. Wu"
  responsible_maintainers:
    - "KT. Wu"
  license: "Apache-2.0"

repository:
  role: "substantive-development"

sources:
  - title: "Beweisbarkeit und Unbeweisbarkeit von Anfangsfällen der transfiniten Induktion in der reinen Zahlentheorie"
    authors:
      - "Gerhard Gentzen"
    id: "Math. Ann. 119 (1943), 140–161"
    type: "paper"
    location: "the theorem as a whole: provability of transfinite induction below every notation less than epsilon_0 and unprovability of transfinite induction along epsilon_0"
    relationship: "formalizes"
    note: >-
      The original source of both halves.  The development does not transcribe the 1943
      argument: the upper bound is Gentzen's jump construction carried out on an arithmetization
      of the notations inside PA, and the lower bound is the modern infinitary argument
      (embedding, cut elimination, boundedness) of the tradition that follows Buchholz, not the
      reduction of Gentzen's paper.
    author_endorsement: "n/a"
  - title: "Notation systems for infinitary derivations"
    authors:
      - "Wilfried Buchholz"
    id: "Arch. Math. Logic 30 (1991), 277–296"
    type: "paper"
    location: "the infinitary calculus with evaluated closed terms and the embedding of arithmetic into it"
    relationship: "adapts"
    note: >-
      The lower bound follows the infinitary approach of this paper, adapted to Foundation's
      one-sided calculus and to the language with a fresh predicate X.  The normalising
      instantiation (substitute the numeral, then evaluate closed terms) is the one place where a
      naive calculus fails and the convention of the paper is needed; see the header of
      `OrdinalAnalysis/Omega/Calculus.lean`.  The formalization is not a transcription of the
      paper, and the exact form of the calculus is the development's own.
    author_endorsement: "not-contacted"
  - title: "Proof Theory: The First Step into Impredicativity"
    authors:
      - "Wolfram Pohlers"
    id: "Universitext, Springer, 2009"
    type: "book"
    location: "the ordinal analysis of Peano arithmetic"
    relationship: "background"
    note: >-
      A textbook treatment of the theorem, consulted for orientation only.  No statement or proof
      of the book is formalized as such.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/MaxWellApexLab/OrdinalAnalysis/tree/53db882"
    relationship: "other"
    note: >-
      Provenance rather than a separate formalization.  This repository is a frozen snapshot of
      that repository at commit 53db882, made for this submission; the same Lean sources of the
      library are present in both.  Development continues there and not here.
  - id: "https://github.com/FormalizedFormalLogic/goodstein-independence"
    relationship: "other"
    note: >-
      Not a formalization of this theorem.  The repository proves the consistency of Peano
      arithmetic and Goodstein independence (by the fast-growing-hierarchy route) with an
      infinitary calculus and cut elimination; it does not contain the ordinal analysis in the
      transfinite-induction form registered here.  The search behind this remark was informal
      and is not claimed to be exhaustive.

